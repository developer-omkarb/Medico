<div class="backdrop">
    <div class="vitalsignModal">
      <div class="card">
        <div class="card-body">
          <div class="text-center">
            <span class="cardHeading">Vital Sign Details</span>
          </div>
          <form [formGroup]="vitalsignForm" (ngSubmit)="saveVitalSignDetails()">
            <div class="row">
              <div class="col">
                  <div class="form-group md-form">
                    <label for="name">Name</label>
                      <input mdbInput name="name" type="text" formControlName="name" class="form-control textfield">
                      <div #nameerrors *ngIf="name.touched && name.invalid" class="erroriconwrapper text-right">
                        <erroricon (click)="showPopover($event,nameerrors)"></erroricon>
                        <div class="errPopover">
                            <p class="text-danger inputfieldwarnings" *ngIf="name.hasError('required')">- Enter name.</p>
                        </div>
                    </div>
                    </div>
              </div>
              <div class="col">
                  <div class="form-group md-form">
                    <label for="unit">Unit</label>
                    <input mdbInput type="text" name="unit" class="form-control textfield" formControlName="unit">
                      <div #uniterrors *ngIf="unit.touched && unit.invalid" class="erroriconwrapper text-right">
                        <erroricon (click)="showPopover($event,uniterrors)"></erroricon>
                        <div class="errPopover">
                            <p class="text-danger inputfieldwarnings" *ngIf="unit.hasError('required')">- Enter unit.</p>
                        </div>
                    </div>
                    </div>
              </div>
          </div>
          
      <div class="row">
        <div class="col text-center">
          <button type="submit" class="btn btn-success rounded mr-1" [disabled]="!vitalsignForm.valid">Save</button>
      <button class="btn btn-warning rounded" (click)="closePopUp()">Cancel</button>
        </div>
      </div>
          </form>
        </div>
      </div>
    </div>
  </div>
