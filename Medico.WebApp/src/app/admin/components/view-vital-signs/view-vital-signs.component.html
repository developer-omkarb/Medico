<div class="row padding-top-10px">
  <div class="col-md-10 offset-md-1 me-md-1 text-center headMargin">
    <span class="cardHeading">Vital Signs List</span>
    <div class="float-right">
      <a class="addLink" (click)="openPopUp(0)" tooltip="Add Vital Signs">
        <i class="fas fa-plus-circle fa-3x" title="Add Vital Signs"></i>
        <!-- <img class="img-responsive addImg" mdbTooltip="Add Allergy" src="./assets/images/addrecord.png"/> -->
      </a>
      <app-add-vital-sign [vitalSign]="selectedVitalSigns" (onCloseEvent)="closePopUp($event)" *ngIf="showPopUp"></app-add-vital-sign>
    </div>
    </div>
    </div>
    <div class="row">
      <div class="col-md-11 offset-md-1 text-left">
        <app-table-search (searchTexChangedEvent)="updateFilter($event)"
                          placeholderText="Search by vital sign name"></app-table-search>
        <!--<input mdbInput
       type="text"
       placeholder="Search by name"
       class="form-control textfield"
       (keyup)="updateFilter($event)"
     />-->
      </div>

   </div>
    <div class="row">
    <div class="col-md-10 offset-md-1 me-md-1">
      <ngx-datatable #vitalsignTable class='bootstrap card-blueshadow' [columnMode]="'force'" [footerHeight]="50" [rowHeight]="'auto'"    
              [rows]='vitalSigns' [count]="totalCount" [limit]="dataParams.page_size">    
              <ngx-datatable-column [width] ="500" name="Name" prop="name"></ngx-datatable-column> 
              <ngx-datatable-column [width] ="500"name="Unit" prop="unit"></ngx-datatable-column>
              <ngx-datatable-column name="" prop="vitalsignid" [sortable]="false">
                <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                  <a (click)="openPopUp(value)" tooltip="Edit" class="view-link">
                    <i class="fas fa-pencil-alt"></i>
                  </a>
                </ng-template>
              </ngx-datatable-column>   
          </ngx-datatable> 
    </div>
  </div>
