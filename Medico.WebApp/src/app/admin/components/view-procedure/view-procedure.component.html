<div class="row padding-top-10px">
  <div class="col-md-10 offset-md-1 me-md-1 text-center headMargin">
    <span class="cardHeading">Procedures List</span>
    <div class="float-right">
      <a class="addLink" (click)="openPopUp(0)" tooltip="Add Procedure">
        <i class="fas fa-plus-circle fa-3x" title="Add Procedure"></i>
      </a>
      <app-add-procedure [procedure]="selectedProcedure" (onCloseEvent)="closePopUp($event)" *ngIf="showPopUp"></app-add-procedure>
    </div>
    </div>
    </div>
 
    <div class="row">
      <div class="col-md-8 offset-md-1 text-left">
        <app-table-search (searchTexChangedEvent)="updateFilter($event)"
                          placeholderText="Search by procedure code and approach"></app-table-search>
        <!--<input mdbInput
       type="text"
       placeholder="Search by procedure code"
       class="form-control textfield"
       (keyup)="updateFilter($event)"
     />-->
      </div>
      <div class="col-md-2 me-md-1 text-right">
       <div class="deprecated-checkbox">
         <input type="checkbox" name="isdeprecated" (change)="FilterByStatus($event)">
       <label for="isdeprecated">Show deprecated</label>
       </div>
      </div>
   </div>
    <div class="row">
    <div class="col-md-10 offset-md-1 me-md-1">
      <ngx-datatable #procedureTable class='bootstrap card-blueshadow' [columnMode]="'force'" [footerHeight]="50" [rowHeight]="'auto'"    
              [rows]='procedure' [count]="totalCount" [limit]="dataParams.page_size">    
              <ngx-datatable-column [width] ="100"name="Code" prop="code"></ngx-datatable-column> 
              <ngx-datatable-column [width] ="600"name="Approach" prop="approach"></ngx-datatable-column>  
              <ngx-datatable-column [width] ="200"name="Relevance" prop="isDeprecated" [canAutoResize]="true">
                <ng-template let-row="row" class="text-center" let-value="value" ngx-datatable-cell-template>
                  <span class="text-success" *ngIf="value==false">Active</span>
                  <span class="text-danger" *ngIf="value==true">Deprecated</span>
                </ng-template>
            </ngx-datatable-column>
              <ngx-datatable-column name="" prop="procedureid" [sortable]="false">
                <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                  <a (click)="openPopUp(value)" tooltip="Edit" class="view-link">
                    <i class="fas fa-pencil-alt"></i>
                  </a>
                </ng-template>
              </ngx-datatable-column>   
          </ngx-datatable> 
    </div>
  </div>
