<div class="row padding-top-10px headMargin">
  <div class="col-md-10 offset-md-1 me-md-1 text-center">
    <span class="cardHeading">Employees List</span>
  </div>
</div>
<div class="row">
  <div class="col-md-7 offset-md-1 text-left">
    <app-table-search (searchTexChangedEvent)="searchTextChanged($event)"
                      placeholderText="Search By Id or Name"></app-table-search>
    <!--<input type='text'
           style='padding:8px;margin:15px auto;width:70%;'
           placeholder='Search by Id or Name'
           (keyup)='Search($event)' />-->
  </div>

  <div class="col-md-3 me-md-1 text-right editSearch">
    <a class="link" (click)="addUser()">
      <i class="fas fa-user-plus fa-lg link" title="Add User"></i>
    </a>
    </div>
  </div>



  <div *ngIf="showPopUp">
    <app-add-user [selectedUser]="userData" (onCloseEvent)="closePopUp($event)"></app-add-user>
  </div>
  <ngx-datatable #apptTable class='bootstrap card-blueshadow col-md-10 offset-md-1 me-md-1' [columnMode]="'force'" [footerHeight]="50" [rowHeight]="'auto'"
                 [rows]='users' [count]="totalCount" [limit]="dataParams.page_size">

    <ngx-datatable-column [width]="30" name="Code" prop="employeecode"></ngx-datatable-column>
    <ngx-datatable-column [width]="200" name="UserName" prop="username"></ngx-datatable-column>

    <ngx-datatable-column [width]="50" name="Role" prop="role"></ngx-datatable-column>

    <ngx-datatable-column name="Name" prop="name"></ngx-datatable-column>
    <ngx-datatable-column>
      <ng-template let-column="column" ngx-datatable-header-template>
        Date Of Registration
      </ng-template>
      <ng-template let-row="row" ngx-datatable-cell-template>
        <strong> {{row.createddate|date}}</strong>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="Status" prop="status" [canAutoResize]="true">
      <ng-template let-row="row" class="text-center" let-value="value" ngx-datatable-cell-template>
        <span class="text-success" *ngIf="value=='Active'">Active</span>
        <span class="text-danger" *ngIf="value=='Inactive'">Inactive</span>
        <span *ngIf="value=='Blocked'">Blocked</span>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column [width]="80" name="" prop="action" [sortable]="false">
      <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
        <a (click)="editUser(row)" class="view-link">
          <i class="fas fa-pencil-alt fa-lg" title="Edit"></i>
        </a>&nbsp;
        <a *ngIf="(row.status == 'Inactive' )|| (row.status == 'Blocked')" (click)="ActivateUser(row)" class="view-link">
          <i class="fas fa-toggle-off fa-lg" title="Activate User"></i>
        </a>&nbsp;
        <a *ngIf="(row.status == 'Active' )" (click)="DeactivateUser(row)" class="view-link">
          <i class="fas fa-toggle-on fa-lg" aria-hidden="true" title="Deactivate User"></i>
        </a>&nbsp;
        <!--<a *ngIf="(row.status == 'Active' )|| (row.status == 'Inactive')" (click)="BlockUser(row)" class="view-link">
        <i class="fas fa-solid fa-user-lock fa-lg" title="Block User"></i>
      </a>-->
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
