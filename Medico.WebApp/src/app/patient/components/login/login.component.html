<app-header></app-header>
<div class="topMarginContent">
    <div class="col-md-12 pl-0 pr-0">
        <div class="row nopadding">
            <div class="col-md-6 offset-md-1 me-md-1">
                <img class="img-fluid loginimg" src="./assets/images/Login.PNG" alt="Login-Medico" />
            </div>
            <hr class="clearfix w-100 d-md-none pb-3">
            <div class="card-blueshadow col-md-4 mt-md-0 mt-4">
                <div class="card border-0 row nopadding">
                    <div class="card-body">
                        <div class="text-center">
                            <p class="cardHeading"> Login</p>
                        </div>
                        <br>
                        <form [formGroup]="loginForm" (ngSubmit)="onUserLoginM()">

                            <div class="md-form form-group">
                                <label for="Username">Username</label>
                                <input formControlName="username" mdbInput type="text" class="form-control textfield" id="firstName" (blur)="validateUser(username)">

                                <div #usernameerrors *ngIf="username.touched && username.invalid" class="text-right erroriconwrapper">
                                    <error-icon (click)="showPopover($event,usernameerrors)"></error-icon>

                                    <div class="errPopover">
                                        <p class="text-danger inputfieldwarnings" *ngIf="username.hasError('required')">- Enter email.</p>
                                        <p class="text-danger inputfieldwarnings" *ngIf="username.hasError('email')">- Enter valid email.</p>
                                    </div>
                                </div>
                            </div>


                            <div class="md-form form-group">
                                <label for="password">Password</label>
                                <input type="password" name="password" mdbInput class="form-control textfield" formControlName="password">
                                <div #passworderrors *ngIf="password.touched && password.invalid" class="erroriconwrapper text-right">
                                    <error-icon (click)="showPopover($event,passworderrors)"></error-icon>

                                    <div class="errPopover">
                                        <p class="text-danger inputfieldwarnings" *ngIf="password.hasError('required')">- Enter password.
                                        </p>
                                        <p class="text-danger inputfieldwarnings" *ngIf="password.hasError('pattern')">- Password should contain atleast one uppercase, lowercase, special character, number.</p>
                                        <p class="text-danger inputfieldwarnings" *ngIf="password.hasError('hasSymbol')">- Password must have atleast 8 characters .</p>
                                    </div>
                                </div>
                            </div>
                            <br>
                            <div class="form-group">
                                <div class="text-center">
                                    <a class="text-info" (click)="sendMail()">Forget Password?</a>
                                </div>
                                <div class="text-center">
                                    <button type="submit" mdbBtn class="btn btn-success rounded" [disabled]="!loginForm.valid || !userExists">Login</button>
                                </div>
                                <div class="text-center">
                                    <p class="text-dark">Don't have an account?&nbsp;<a class="text-info" routerLink="/user/register">Register</a></p>
                                </div>
                            </div>
                        </form>

                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
