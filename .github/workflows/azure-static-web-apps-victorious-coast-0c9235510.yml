name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master-medico_WORKING_.Net10.0_AzureSQLDB
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master-medico_WORKING_.Net10.0_AzureSQLDB

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # 🔒 Angular 10 is safest with Node 16
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      # 🚀 Build & Deploy to Azure Static Web Apps
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_COAST_0C9235510 }}
          action: "upload"

          # 📁 Angular app lives here
          app_location: "./Medico.WebApp"

          # ❌ No Azure Functions in this Static Web App
          api_location: ""

          # 📦 Angular build output (must match angular.json outputPath)
          output_location: "dist/skillerexplorer"

          # ⚠️ Fix Angular 10 + npm dependency conflicts
          app_build_command: "npm install --legacy-peer-deps && npm run build"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
